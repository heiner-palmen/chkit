[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chkit"
version = "0.3.0"
description = "Building blocks for Clone Hero tools: charts, song folders, the game's files"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
game = ["evdev; sys_platform == 'linux'"]

[project.urls]
Homepage = "https://github.com/heiner-palmen/chkit"

[tool.setuptools.packages.find]
include = ["chkit*"]
